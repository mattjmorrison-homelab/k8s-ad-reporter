apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ad-reporter-discord-webhooks
  namespace: ad-reporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: ad-reporter-discord-webhooks
    creationPolicy: Owner
  data:
    - secretKey: confirmed-webhook-url
      remoteRef:
        key: homelab/service/admin-discord/k8s-ad-reporter/confirmed-webhook-url
        property: value
    - secretKey: suspicious-webhook-url
      remoteRef:
        key: homelab/service/admin-discord/k8s-ad-reporter/suspicious-webhook-url
        property: value
