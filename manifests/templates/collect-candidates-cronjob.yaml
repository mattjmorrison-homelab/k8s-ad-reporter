apiVersion: batch/v1
kind: CronJob
metadata:
  name: ad-reporter-collect-candidates
  namespace: ad-reporter
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ad-reporter-zot-pull-secret
          containers:
            - name: collect-candidates
              image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
              command: ["uv", "run", "python", "-m", "ad_reporter.cronjobs.collect_candidates"]
